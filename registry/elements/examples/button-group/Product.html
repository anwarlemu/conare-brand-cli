<!-- The agent prompt's split button: Copy prompt, and an arrow with the one-click installs. Then secondary buttons
     that share a hairline, as a pager does. -->
<div class="grid items-center gap-2 md:grid-cols-[112px_minmax(0,1fr)] md:gap-x-6 md:gap-y-8">
  <p class="type-meta leading-7 text-fg-muted">Split</p>
  <div class="h-28">
    <conare-button-group label="connect your agent">
      <conare-pixel-button id="copy-prompt">
        <conare-text-swap>
          <span slot="a" class="contents"><i data-lucide="copy" data-size="12" data-stroke-width="1.5" aria-hidden="true"></i>Copy prompt</span>
          <span slot="b" class="contents"><i data-lucide="check" data-size="12" data-stroke-width="2" aria-hidden="true"></i>Copied</span>
        </conare-text-swap>
      </conare-pixel-button>
      <conare-menu placement="end" label="other ways to connect" trigger-label="other ways to connect" width="200px" id="installs">
        <button slot="trigger" type="button" class="group/trigger relative inline-flex h-control-sm w-control-sm cursor-pointer items-center justify-center bg-action-primary text-action-primary-fg transition-[background-color] duration-120 ease-standard hover:bg-edge-accent focus-visible:outline-edge-accent max-md:h-control-touch max-md:w-control-touch"><i data-lucide="chevron-down" data-size="12" data-stroke-width="1.5" class="transition-[rotate] duration-120 ease-out motion-reduce:transition-none group-aria-expanded/trigger:rotate-180" aria-hidden="true"></i></button>
        <conare-menu-item href="#cursor"><span class="flex-1">Add to Cursor</span><i data-lucide="arrow-up-right" data-size="12" data-stroke-width="1.5" aria-hidden="true"></i></conare-menu-item>
        <conare-menu-item href="#vscode"><span class="flex-1">Add to VS Code</span><i data-lucide="arrow-up-right" data-size="12" data-stroke-width="1.5" aria-hidden="true"></i></conare-menu-item>
      </conare-menu>
    </conare-button-group>
  </div>
  <p class="mt-4 type-meta leading-7 text-fg-muted md:mt-0">Secondary</p>
  <div>
    <conare-button-group label="pages">
      <conare-button icon aria-label="previous page" id="prev"><i data-lucide="chevron-left" data-size="14" data-stroke-width="1.5"></i></conare-button>
      <conare-button class="tabular-nums" aria-live="polite" id="page">Page 2 of 4</conare-button>
      <conare-button icon aria-label="next page" id="next"><i data-lucide="chevron-right" data-size="14" data-stroke-width="1.5"></i></conare-button>
    </conare-button-group>
  </div>
</div>
<script type="module">
  // Copy prompt: the clipboard (or the copy command where it is refused), then Copied for 1.5s.
  const copyButton = document.getElementById('copy-prompt')
  const swap = copyButton.querySelector('conare-text-swap')
  let timer
  copyButton.addEventListener('click', async () => {
    const text = 'Connect to Acme over MCP.'
    try { await navigator.clipboard.writeText(text) }
    catch {
      const back = document.activeElement
      let deep = back
      while (deep?.shadowRoot?.activeElement) deep = deep.shadowRoot.activeElement
      const field = Object.assign(document.createElement('textarea'), { value: text })
      field.style.position = 'fixed'
      field.style.opacity = '0'
      document.body.append(field)
      field.select()
      try { document.execCommand('copy') } catch {}
      field.remove()
      deep?.focus()
    }
    copyButton.done = swap.on = true
    clearTimeout(timer)
    timer = setTimeout(() => { copyButton.done = swap.on = false }, 1500)
  })
  // The pager: Page n of 4, the ends disabled.
  let page = 2
  const paint = () => {
    document.getElementById('page').textContent = `Page ${page} of 4`
    for (const [id, off] of [['prev', page === 1], ['next', page === 4]]) {
      const button = document.getElementById(id)
      button.disabled = off
    }
  }
  document.getElementById('prev').addEventListener('click', () => { page--; paint() })
  document.getElementById('next').addEventListener('click', () => { page++; paint() })
  await customElements.whenDefined('conare-button')
  paint()
</script>

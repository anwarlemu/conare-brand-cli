  <conare-toaster></conare-toaster>
</div>
<script type="module">
  // The menu names the document it opened for; each row says what it did in a toast.
  const menu = document.getElementById('document-menu')
  let doc
  menu.addEventListener('open', (event) => {
    const row = menu.querySelector(`[data-context="${event.detail.context}"]`)
    doc = { id: event.detail.context, title: row?.querySelector('.truncate')?.textContent }
    menu.querySelector('[data-title]').textContent = doc.title ?? ''
  })
  for (const item of menu.querySelectorAll('[data-note]')) {
    item.addEventListener('select', () => document.querySelector('conare-toaster').toast(item.dataset.note, doc?.[item.dataset.show]))
  }
</script>

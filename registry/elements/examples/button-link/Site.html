<!-- The website's buttons: the dark one with its pixel fill and arrow for the main call to action, outlined for the
     rest; light and ghost on a dark band. -->
<div class="flex flex-col gap-6">
  <div class="flex flex-wrap items-center gap-3">
    <conare-button-link href="#demo" pixels arrow>Book a demo</conare-button-link>
    <conare-button-link href="#docs" variant="secondary">Read the docs</conare-button-link>
    <conare-button-link href="#pricing" variant="secondary" size="sm">Pricing</conare-button-link>
  </div>
  <div data-theme="dark" class="flex flex-wrap items-center gap-3 bg-off-black p-6">
    <conare-button-link href="#demo" variant="light">Book a demo</conare-button-link>
    <conare-button-link href="#docs" variant="ghost">Read the docs</conare-button-link>
  </div>
</div>

<!-- A label over its field, and one with a note: the label names the field, the note says it can be left empty. -->
<div class="flex w-90 max-w-full flex-col gap-4">
  <div class="flex flex-col gap-1.5"><conare-label for="label-name">Name</conare-label><conare-input id="label-name" placeholder="production-agent"></conare-input></div>
  <div class="flex flex-col gap-1.5"><conare-label for="label-desc" hint="optional">Description</conare-label><conare-input id="label-desc" placeholder="What it is for"></conare-input></div>
</div>

    header='{"items": [{"label": "Search", "desc": "Find the answer in any file.", "href": "#search"}, {"label": "Sync", "desc": "Keep your apps in step.", "href": "#sync"}, {"label": "Parse", "desc": "Read every row and cell.", "href": "#parse"}], "links": [{"label": "Pricing", "href": "#pricing"}, {"label": "Blog", "href": "#blog"}, {"label": "Docs", "href": "#docs"}], "homeLabel": "Acme home"}'

    <conare-button slot="actions" href="#contact">Contact us</conare-button>
    <conare-pixel-button slot="actions" href="#sign-in">Sign in</conare-pixel-button>
    <conare-button slot="sheet-actions" href="#contact">Contact us</conare-button>
    <conare-pixel-button slot="sheet-actions" href="#sign-in">Sign in</conare-pixel-button>
  </conare-contact-page>
</div>
<script type="module">
  await customElements.whenDefined('conare-contact-page')
  const page = document.getElementById('contact')
  page.addEventListener('submit', () => { page.sent = true })
  page.addEventListener('edit', () => { page.sent = false })
</script>

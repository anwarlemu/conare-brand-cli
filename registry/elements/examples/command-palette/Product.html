<!-- The sidebar's search alone, in the middle of the frame: a click opens the palette, and the frame grows for it.
     On a console page, ⌘K and / open it too. Documents are sample matches, found 200ms after the last key. -->
<div class="flex w-full items-center justify-center" id="palette-frame">
  <div class="w-sidebar">
    <button type="button" id="open-palette" class="flex h-control-sm w-full cursor-pointer items-center gap-2 border border-edge bg-surface pr-2 pl-2.25 text-left text-meta text-fg-muted max-md:h-control-touch max-md:text-ui pointer-coarse:h-control-touch pointer-coarse:text-ui outline-none transition-[border-color] duration-120 ease-standard hover:border-edge-strong focus-visible:border-edge-focus" aria-haspopup="dialog" aria-expanded="false">
      <i data-lucide="search" data-size="14" data-stroke-width="1.5" aria-hidden="true" class="shrink-0"></i>
      <span>Search</span>
      <kbd aria-hidden="true" class="ml-auto font-text text-caption max-md:hidden">⌘K</kbd>
    </button>
  </div>
  <conare-command-palette id="palette">
    <img slot="mark" src="/conare-ds/logo/svg/mark-white.svg" alt="" width="14" height="12" class="h-3 w-auto">
  </conare-command-palette>
  <!-- The rows' icons: Lucide svgs, by name. -->
  <template id="palette-icons">
    <i data-lucide="activity" data-name="activity"></i>
    <i data-lucide="atom" data-name="atom"></i>
    <i data-lucide="book-open" data-name="book-open"></i>
    <i data-lucide="compass" data-name="compass"></i>
    <i data-lucide="credit-card" data-name="credit-card"></i>
    <i data-lucide="gauge" data-name="gauge"></i>
    <i data-lucide="house" data-name="house"></i>
    <i data-lucide="key-round" data-name="key-round"></i>
    <i data-lucide="layers" data-name="layers"></i>
    <i data-lucide="network" data-name="network"></i>
    <i data-lucide="plug" data-name="plug"></i>
    <i data-lucide="settings" data-name="settings"></i>
    <i data-lucide="square-terminal" data-name="square-terminal"></i>
    <i data-lucide="user-plus" data-name="user-plus"></i>
  </template>
</div>
<script type="module">
  await customElements.whenDefined('conare-command-palette')
  const palette = document.getElementById('palette')
  const frame = document.getElementById('palette-frame')
  const button = document.getElementById('open-palette')
  const icons = Object.fromEntries([...document.getElementById('palette-icons').content.querySelectorAll('svg')].map((svg) => [svg.dataset.name, svg.outerHTML]))
  const link = ([label, name]) => ({ label, icon: icons[name] })
  palette.pages = [['Overview', 'house'], ['Namespaces', 'layers'], ['Sources', 'network'], ['Agents', 'square-terminal'], ['Custom models', 'atom'], ['API keys', 'key-round'], ['Performance', 'gauge'], ['Usage', 'activity'], ['Billing', 'credit-card'], ['Settings', 'settings'], ['Explorer', 'compass']].map(link)
  palette.actions = [['Connect an app', 'plug'], ['Create an API key', 'key-round'], ['Copy the agent prompt', 'square-terminal'], ['Invite members', 'user-plus'], ['Open the docs', 'book-open']].map(link)
  palette.namespaces = [
    { name: 'contracts', documents: 412830 }, { name: 'slack', documents: 96410 }, { name: 'crm', documents: 52660 },
    { name: 'engineering', documents: 31902 }, { name: 'support', documents: 18240 }, { name: 'wiki', documents: 7385 },
  ]
  const corpus = [
    { id: 'msa-acme-2025.pdf', namespace: 'contracts', text: 'Either party may terminate this agreement with 90 days written notice.' },
    { id: 'renewal-policy.md', namespace: 'wiki', text: 'Renewals are reviewed 60 days before the term ends.' },
    { id: 'C04-launch-thread', namespace: 'slack', text: 'Notice period for the pilot is 30 days, per the order form.' },
  ]
  // The frame grows for the open palette, and the button says it is open.
  const opened = (open) => {
    frame.classList.toggle('min-h-140', open)
    button.setAttribute('aria-expanded', String(open))
  }
  button.addEventListener('click', () => {
    palette.open = true
    opened(true)
  })
  palette.addEventListener('open-change', (event) => opened(event.detail.value))
  let timer
  palette.addEventListener('query', (event) => {
    const text = event.detail.value
    clearTimeout(timer)
    palette.documents = []
    palette.searching = !!text
    if (!text) return
    // ds-latency: a stand-in for the app's search request.
    timer = setTimeout(() => {
      const words = text.toLowerCase().split(/\s+/)
      palette.documents = corpus.filter((d) => words.some((w) => `${d.id} ${d.text}`.toLowerCase().includes(w)))
      palette.searching = false
    }, 200)
  })
</script>

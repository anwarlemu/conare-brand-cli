<!-- The switcher at the top of the sidebar, with sample organizations. Its row has its four edges here, where no
     sidebar frames it. Picking one switches the sample; listen for `change` to switch for real. -->
<div class="h-96">
  <div class="h-bar w-sidebar border border-edge bg-surface-subtle">
    <conare-workspace-switcher value="prod" admin groups='[{ "id": "acme", "name": "Acme", "role": "admin", "organizations": [{ "id": "prod", "name": "Acme production", "default": true }, { "id": "staging", "name": "Acme staging" }] }, { "id": "acme-labs", "name": "Acme labs", "role": "member", "organizations": [{ "id": "research", "name": "Acme research" }] }]'>
      <img slot="mark" src="/conare-ds/logo/svg/mark.svg" alt="" height="20" class="h-5 w-auto shrink-0">
    </conare-workspace-switcher>
  </div>
</div>

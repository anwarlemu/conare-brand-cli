<!-- Several open at once, for a checklist the person works down. -->
<div class="max-w-[560px]">
  <conare-accordion value='["keys"]' multiple>
    <conare-accordion-item value="keys" heading="Create an API key">Settings, then API keys. Copy it once: it is not shown again.</conare-accordion-item>
    <conare-accordion-item value="source" heading="Connect a source">Pick an app and sign in. Its documents start syncing into a namespace.</conare-accordion-item>
    <conare-accordion-item value="search" heading="Run a search">Ask a question in plain words. The best match comes first, with its source.</conare-accordion-item>
  </conare-accordion>
</div>

<!-- A card with its one action, and the dark panel with a window beside it: How it works' search step (step-viz),
     which plays once as it renders. -->
<conare-work-panel heading="Run a search" line="Ask your data a question. Conare finds the passages that answer it." label="an example" tall>
  <conare-pixel-button large>Run a search</conare-pixel-button>
  <conare-step-viz slot="window" step="2" runs="[0, 0, 0, 0]" active></conare-step-viz>
</conare-work-panel>

<!-- A row's tools as icon buttons, each named by its tooltip. Point at one and wait, then move along: the next shows at
     once. Tab to one and its name shows without a wait. -->
<div class="flex min-h-24 items-start justify-center gap-1">
  <conare-tooltip text="Copy ID"><conare-button variant="ghost" icon aria-label="copy id"><i data-lucide="copy" data-size="14" data-stroke-width="1.5"></i></conare-button></conare-tooltip>
  <conare-tooltip text="Download"><conare-button variant="ghost" icon aria-label="download"><i data-lucide="download" data-size="14" data-stroke-width="1.5"></i></conare-button></conare-tooltip>
  <conare-tooltip text="Sync again"><conare-button variant="ghost" icon aria-label="sync again"><i data-lucide="refresh-cw" data-size="14" data-stroke-width="1.5"></i></conare-button></conare-tooltip>
  <conare-tooltip text="Delete"><conare-button variant="ghost" icon aria-label="delete"><i data-lucide="trash-2" data-size="14" data-stroke-width="1.5"></i></conare-button></conare-tooltip>
</div>

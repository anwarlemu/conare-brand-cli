<script type="module">
  const teams = [{"where": "Sales agent", "ask": "What did Acme ask for at renewal?", "answer": "Twelve more months on 60 days notice, with their data kept in the EU region.", "source": "renewal-call.md"}, {"where": "Finance agent", "ask": "Which invoices are past 30 days?", "answer": "Three: two from the March batch and one held for a missing purchase order.", "source": "ledger.xlsx"}, {"where": "Coding agent over MCP", "ask": "Why do sync jobs retry twice?", "answer": "The worker retries on a timeout, and the queue retries the same job once more.", "source": "issue-1182"}, {"where": "Support agent", "ask": "How does a customer reset their key?", "answer": "Settings, then API keys: revoke the old one and create a new one in its place.", "source": "help-center.md"}, {"where": "Assistant", "ask": "Where does the contract say data is stored?", "answer": "Schedule C names the EU region, and every subprocessor is listed beside it.", "source": "acme-msa.pdf"}]
  await customElements.whenDefined('conare-hero')
  const hero = document.getElementById('hero')
  hero.addEventListener('change', () => {
    const t = teams[hero.value]
    hero.querySelector('[data-where]').textContent = t.where
    // A new body for each team, so its parts rise again (Vue's :key).
    const old = hero.querySelector('[data-answer]')
    const body = old.cloneNode(true)
    body.querySelector('[data-ask]').textContent = t.ask
    body.querySelector('[data-text]').textContent = t.answer
    body.querySelector('[data-source]').textContent = t.source
    old.replaceWith(body)
  })
</script>

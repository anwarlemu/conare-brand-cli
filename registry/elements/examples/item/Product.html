<!-- A card's rows: what a namespace is, a row with its tool, and rows that open something, filling to the card's edge
     under the pointer. -->
<div class="grid gap-6 md:grid-cols-2">
  <conare-card heading="contracts">
    <conare-item-group class="-my-2">
      <li><conare-item heading="Documents"><span slot="meta" class="tabular-nums">412,830</span></conare-item></li>
      <li><conare-item heading="Region"><span slot="meta" class="contents">United States</span></conare-item></li>
      <li><conare-item heading="Embedding model" description="Used for every document in it"><span slot="meta" class="type-code-sm">acme-embed-1</span></conare-item></li>
      <li><conare-item heading="API key" description="Last used 2 min ago"><conare-button slot="actions">Rotate</conare-button></conare-item></li>
    </conare-item-group>
  </conare-card>
  <conare-card heading="Settings">
    <conare-item-group class="-my-2">
      <li><conare-item href="#members" heading="Members" arrow><span slot="meta" class="contents">4 of 10 seats</span></conare-item></li>
      <li><conare-item href="#billing" heading="Billing" arrow><span slot="meta" class="contents">Pro</span></conare-item></li>
      <li><conare-item href="#keys" heading="API keys" description="Create and revoke keys" arrow></conare-item></li>
    </conare-item-group>
  </conare-card>
</div>

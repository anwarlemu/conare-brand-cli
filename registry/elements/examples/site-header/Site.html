     buttons go in twice: in the bar and in the sheet. -->

    items='[{ "label": "Search", "desc": "Store documents and query them.", "href": "#search" }, { "label": "Sync", "desc": "Keep your apps in a namespace.", "href": "#sync" }, { "label": "Parse", "desc": "Read any file in full, every row and cell.", "href": "#parse" }, { "label": "Embed", "desc": "Embeddings for any vector database.", "href": "#embed" }, { "label": "Rerank", "desc": "Put the best passages first.", "href": "#rerank" }]'

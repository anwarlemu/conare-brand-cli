<!-- The audit log by page, where a page is a place to come back to; and credits added, read from the top, five more
     at a time. -->
<div class="grid gap-8 md:grid-cols-2">
  <div class="flex flex-col gap-3">
    <conare-table framed label="audit log">
      <table>
        <thead><tr><th>Event</th><th>By</th><th class="text-right">When</th></tr></thead>
        <tbody id="events"></tbody>
      </table>
    </conare-table>
    <conare-pagination id="pages" page="1" pages="5" label="audit log pages" class="self-end"></conare-pagination>
  </div>
  <div class="flex flex-col gap-3">
    <ul class="flex flex-col border border-edge" id="grants"></ul>
    <conare-show-more id="more" class="self-start" count="5"></conare-show-more>
  </div>
</div>
<script type="module">
  const events = Array.from({ length: 23 }, (_, i) => ({ what: ['Key created', 'Member invited', 'Namespace deleted', 'Key revoked'][i % 4], who: 'member' + ((i % 3) + 1) + '@acme.dev', when: `Oct ${28 - i}` }))
  const PER = 5
  const grants = Array.from({ length: 12 }, (_, i) => ({ amount: (12 - i) * 50, when: `${['Oct', 'Sep', 'Aug', 'Jul'][i % 4]} ${1 + i}` }))
  const body = document.getElementById('events')
  const pager = document.getElementById('pages')
  const list = document.getElementById('grants')
  const more = document.getElementById('more')
  const cell = (text, cls) => Object.assign(document.createElement('td'), { textContent: text, className: cls ?? '' })
  // The page's rows.
  const paintPage = (page) => {
    body.replaceChildren(...events.slice((page - 1) * PER, page * PER).map((e) => {
      const tr = document.createElement('tr')
      tr.append(cell(e.what), cell(e.who, 'type-code-sm'), cell(e.when, 'text-right type-meta text-fg-muted'))
      return tr
    }))
  }
  pager.addEventListener('page-change', () => paintPage(pager.page))
  paintPage(1)
  // Five more at a time; Show more goes once all are shown.
  let shown = 5
  const paintGrants = () => {
    list.replaceChildren(...grants.slice(0, shown).map((g) => {
      const li = document.createElement('li')
      li.className = 'flex justify-between border-b border-edge px-3 py-2.5 last:border-b-0 type-ui'
      li.append(Object.assign(document.createElement('span'), { className: 'text-fg-muted', textContent: g.when }), Object.assign(document.createElement('span'), { className: 'tabular-nums', textContent: `+$${g.amount.toFixed(2)}` }))
      return li
    }))
    more.hidden = shown >= grants.length
    more.count = Math.min(5, grants.length - shown)
  }
  more.addEventListener('click', () => { shown += 5; paintGrants() })
  paintGrants()
</script>

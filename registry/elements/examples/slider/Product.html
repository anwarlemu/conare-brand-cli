<!-- How many passages a search returns, and a minimum score: the value beside each in tabular figures. -->
<div class="flex w-90 max-w-full flex-col gap-4">
  <div class="flex flex-col gap-1">
    <div class="flex items-baseline justify-between type-meta"><span class="text-fg-soft">Passages per search</span><span class="tabular-nums" id="top-k-value">8</span></div>
    <conare-slider id="top-k" value="8" label="passages per search" min="1" max="20"></conare-slider>
  </div>
  <div class="flex flex-col gap-1">
    <div class="flex items-baseline justify-between type-meta"><span class="text-fg-soft">Minimum score</span><span class="tabular-nums" id="score-value">0.40</span></div>
    <conare-slider id="score" value="40" label="minimum score" value-text="0.40" step="5"></conare-slider>
  </div>
  <div class="flex flex-col gap-1">
    <div class="flex items-baseline justify-between type-meta"><span class="text-fg-muted">Rerank depth (on the Scale plan)</span><span class="tabular-nums text-fg-muted">50</span></div>
    <conare-slider value="50" label="rerank depth" disabled></conare-slider>
  </div>
</div>
<script type="module">
  const topK = document.getElementById('top-k')
  const score = document.getElementById('score')
  topK.addEventListener('input', () => { document.getElementById('top-k-value').textContent = topK.value })
  score.addEventListener('input', () => {
    const text = (score.value / 100).toFixed(2)
    document.getElementById('score-value').textContent = text
    score.valueText = text
  })
</script>

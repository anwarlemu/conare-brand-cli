<!-- The sidebar's organization switcher, open to show its rows: the organizations under their customer, the current
     one checked, then what goes with an organization. Sample data; listen for `select` on a row to switch. -->
<div class="h-80 w-sidebar">
  <div class="h-bar">
    <conare-menu label="workspaces" offset="8px" open class="!flex h-full w-full" id="workspaces">
      <button slot="trigger" type="button" class="relative isolate flex h-full w-full cursor-pointer items-center gap-2 px-3 text-left before:absolute before:inset-x-2 before:inset-y-1.5 before:-z-10 before:transition-colors before:duration-120 before:ease-standard hover:before:bg-edge/45 aria-expanded:before:bg-edge/45 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-edge-focus">
        <span class="inline-flex size-5 shrink-0 items-center justify-center border border-edge bg-surface text-caption leading-none font-medium" aria-hidden="true" data-initial>A</span>
        <span class="min-w-0 flex-1">
          <span class="block truncate text-meta leading-3 font-medium" data-name>Acme production</span>
          <span class="mt-0.5 block truncate text-caption leading-3 text-fg-muted">Acme · admin</span>
        </span>
        <i data-lucide="chevrons-up-down" data-size="14" data-stroke-width="1.5" class="mr-0.75 shrink-0 text-fg-muted" aria-hidden="true"></i>
      </button>
      <conare-menu-label><span class="truncate">Acme</span><span class="shrink-0 border border-edge px-1 text-caption leading-4">admin</span></conare-menu-label>
      <conare-menu-item data-org="Acme production" current>
        <span class="inline-flex size-5 shrink-0 items-center justify-center border border-edge bg-surface text-caption leading-none font-medium" aria-hidden="true">A</span>
        <span class="min-w-0 flex-1 truncate">Acme production</span>
        <span class="type-meta text-fg-muted">default</span>
        <i data-lucide="check" data-size="14" data-stroke-width="1.5" class="shrink-0" aria-label="current"></i>
      </conare-menu-item>
      <conare-menu-item data-org="Acme staging">
        <span class="inline-flex size-5 shrink-0 items-center justify-center border border-edge bg-surface text-caption leading-none font-medium" aria-hidden="true">A</span>
        <span class="min-w-0 flex-1 truncate">Acme staging</span>
        <i data-lucide="check" data-size="14" data-stroke-width="1.5" class="shrink-0" aria-label="current" hidden></i>
      </conare-menu-item>
      <conare-menu-item data-org="Acme research">
        <span class="inline-flex size-5 shrink-0 items-center justify-center border border-edge bg-surface text-caption leading-none font-medium" aria-hidden="true">A</span>
        <span class="min-w-0 flex-1 truncate">Acme research</span>
        <i data-lucide="check" data-size="14" data-stroke-width="1.5" class="shrink-0" aria-label="current" hidden></i>
      </conare-menu-item>
      <conare-menu-separator></conare-menu-separator>
      <conare-menu-item><i data-lucide="plus" data-size="14" data-stroke-width="1.5" class="shrink-0 text-fg-muted" aria-hidden="true"></i>New organization</conare-menu-item>
      <conare-menu-item><i data-lucide="settings" data-size="14" data-stroke-width="1.5" class="shrink-0 text-fg-muted" aria-hidden="true"></i>Organization settings</conare-menu-item>
      <conare-menu-item><i data-lucide="users" data-size="14" data-stroke-width="1.5" class="shrink-0 text-fg-muted" aria-hidden="true"></i>Invite members</conare-menu-item>
    </conare-menu>
  </div>
</div>
<script type="module">
  // Switching: the chosen organization becomes current, with its check, and the trigger shows it.
  const menu = document.getElementById('workspaces')
  for (const row of menu.querySelectorAll('[data-org]')) {
    row.addEventListener('select', () => {
      for (const other of menu.querySelectorAll('[data-org]')) {
        other.current = other === row
        other.querySelector('svg').toggleAttribute('hidden', other !== row)
      }
      menu.querySelector('[data-name]').textContent = row.dataset.org
      menu.querySelector('[data-initial]').textContent = row.dataset.org.charAt(0)
    })
  }
</script>
